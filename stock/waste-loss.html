<!DOCTYPE html>

<html lang="th">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport"/>
<title>Waste &amp; Loss | CHAIXI BAMEEKIAO Back Office</title>
<link href="../css/app.css" rel="stylesheet"/>
<link href="../css/stock-v2.css" rel="stylesheet"/>
<link href="../css/responsive.css" rel="stylesheet"/>
<link href="../css/ui-store-v3.21.css" rel="stylesheet"/><link href="../css/ui-safe-v3.23.css" rel="stylesheet"/><link href="../css/ui-bottom-nav-v3.26.css" rel="stylesheet"/><link rel="stylesheet" href="../css/ui-overlay-v3.27.css"></head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
<div class="sidebar-brand"><strong>CHAIXI BAMEEKIAO</strong><small>Back Office</small></div>
<nav data-backoffice-nav></nav>
</aside>
<script src="../js/backoffice-sidebar.js"></script>
<div class="main">
<header class="topbar"><div class="topbar-left"><button class="menu-btn" id="menuBtn">☰</button><div><h1>🗑️ Waste / Inventory Loss</h1><p id="branchText">กำลังโหลด...</p></div></div><div class="user-box"><span class="user-name" id="userName">-</span><span class="role-pill" id="roleBadge">-</span><button class="outline-btn" id="logoutBtn">ออกจากระบบ</button></div></header>
<main class="content">
<div class="page-head"><div><h2>ควบคุมของเสียและสูญเสีย</h2><p>บันทึก → รออนุมัติ → ตัด Stock → เก็บ Cost และ Audit</p></div><button class="primary-btn" id="newBtn">+ บันทึกของเสีย</button></div>
<section class="kpi-grid" id="wasteKpis"></section>
<section class="panel"><div class="toolbar waste-toolbar"><label class="field"><span>ตั้งแต่</span><input id="dateFrom" type="date"/></label><label class="field"><span>ถึง</span><input id="dateTo" type="date"/></label><label class="field"><span>สถานะ</span><select id="statusFilter"><option value="">ทั้งหมด</option><option value="pending">รออนุมัติ</option><option value="approved">อนุมัติแล้ว</option><option value="cancelled">ยกเลิก</option><option value="reversed">Reversed</option></select></label><label class="field"><span>เหตุผล</span><select id="reasonFilter"><option value="">ทั้งหมด</option></select></label><button class="outline-btn" id="refreshBtn">↻ รีเฟรช</button></div></section>
<section class="panel"><div class="section-head"><strong>รายการ Waste / Loss</strong><span class="mini-note" id="rowCount">0 รายการ</span></div><div id="list"></div></section>
<p class="message" id="message"></p>
</main></div></div>
<div class="modal hidden" id="newModal"><div class="modal-card modal-wide"><div class="modal-head"><div><h3>บันทึก Waste / Loss</h3><p>ยังไม่ตัด Stock จนกว่าจะอนุมัติ</p></div><button class="icon-btn" id="closeNew">✕</button></div><div class="modal-body">
<div class="form-grid"><label class="field"><span>วันที่ *</span><input id="eventDate" type="date"/></label><label class="field"><span>เหตุผล *</span><select id="reasonCode"></select></label><label class="field field-wide"><span>หมายเหตุ</span><input id="eventNote" maxlength="300" placeholder="เช่น ของเสียรอบเตรียมเช้า"/></label></div>
<div class="waste-add-row"><label class="field"><span>วัตถุดิบ / Prep</span><select id="ingredientSelect"></select></label><label class="field"><span>จำนวน</span><input id="qtyInput" min="0.001" step="0.001" type="number"/></label><button class="small-btn" id="addItemBtn">+ เพิ่มรายการ</button></div>
<div id="draftItems"></div><div class="waste-total"><span>มูลค่าของเสียโดยประมาณ</span><strong id="draftTotal">฿0.00</strong></div><p class="message" id="newMessage"></p></div><div class="modal-actions"><button class="primary-btn" id="saveDraftBtn">บันทึกเพื่อรออนุมัติ</button></div></div></div>
<div class="modal hidden" id="detailModal"><div class="modal-card modal-wide"><div class="modal-head"><div><h3 id="detailTitle">Waste / Loss</h3><p id="detailSub">-</p></div><button class="icon-btn" id="closeDetail">✕</button></div><div class="modal-body"><div id="detailItems"></div><div class="finance-note" id="detailAudit"></div><p class="message" id="detailMessage"></p></div><div class="modal-actions"><button class="danger-btn hidden" id="cancelBtn">ยกเลิกรายการ</button><button class="outline-btn hidden" id="reverseBtn">Reverse</button><button class="primary-btn hidden" id="approveBtn">✓ อนุมัติและตัด Stock</button></div></div></div>
<script src="../js/waste-loss.js" type="module"></script>
<script defer="True" src="../js/ui-store-v3.21.js"></script><script src="../js/ui-safe-v3.23.js"></script><script src="../js/ui-bottom-nav-v3.26.js"></script><script src="../js/ui-overlay-v3.27.js"></script></body></html>
