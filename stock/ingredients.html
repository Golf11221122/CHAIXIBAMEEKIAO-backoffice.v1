<!DOCTYPE html>

<html lang="th">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport"/>
<title>วัตถุดิบ | CHAIXI BAMEEKIAO Back Office</title>
<link href="../css/app.css" rel="stylesheet"/>
<link href="../css/stock-v2.css" rel="stylesheet"/>
<link href="../css/responsive.css" rel="stylesheet"/><link href="../css/print.css" rel="stylesheet"/><link href="../css/ui-store-v3.21.css" rel="stylesheet"/><link href="../css/ui-safe-v3.23.css" rel="stylesheet"/><link href="../css/ui-bottom-nav-v3.26.css" rel="stylesheet"/><link rel="stylesheet" href="../css/ui-overlay-v3.27.css"></head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
<div class="sidebar-brand"><strong>CHAIXI BAMEEKIAO</strong><small>Back Office</small></div>
<nav data-backoffice-nav></nav>
</aside>
<script src="../js/backoffice-sidebar.js"></script>
<div class="main">
<header class="topbar">
<div class="topbar-left"><button class="menu-btn" id="menuBtn">☰</button><div><h1>📦 วัตถุดิบ / Stock</h1><p id="branchText">กำลังโหลด...</p></div></div>
<div class="user-box"><span id="userName">-</span><span class="role-pill" id="roleBadge">-</span><button class="outline-btn" id="logoutBtn">ออกจากระบบ</button></div>
</header>
<main class="content">
<div data-backoffice-subnav></div>
<div class="page-head">
<div><h2>วัตถุดิบและ Stock</h2><p>Raw / Prep / เครื่องดื่ม / Packaging พร้อมหมวดและรอบตรวจนับ</p></div>
<div class="action-row"><a class="outline-btn" href="./categories.html">🗂️ จัดการหมวด</a><a class="outline-btn" href="./production.html">🏭 Production</a><button class="primary-btn" id="addBtn">＋ เพิ่มวัตถุดิบ</button></div>
</div>
<section class="summary-grid">
<article class="summary-card"><span>ทั้งหมด</span><strong id="totalCount">0</strong></article>
<article class="summary-card"><span>Raw</span><strong id="rawCount">0</strong></article>
<article class="summary-card"><span>Prep</span><strong id="prepCount">0</strong></article>
<article class="summary-card"><span>มูลค่า Stock</span><strong id="stockValue">฿0.00</strong></article>
</section>
<section class="panel">
<div class="toolbar">
<input id="search" placeholder="ค้นหาวัตถุดิบ..."/>
<select id="typeFilter">
<option value="">ทุกประเภท</option>
<option value="raw">Raw Ingredient</option>
<option value="prep">Prep / แปรรูป</option>
<option value="beverage">เครื่องดื่ม</option>
<option value="packaging">Packaging</option>
<option value="consumable">Consumable</option>
</select>
<select id="categoryFilter"><option value="">ทุกหมวด</option></select>
<select id="frequencyFilter"><option value="">ทุกรอบนับ</option><option value="daily">รายวัน</option><option value="weekly">รายสัปดาห์</option><option value="monthly">รายเดือน</option></select>
<select id="status"><option value="">ทุกสถานะ</option><option value="low">ใกล้หมด</option><option value="out">หมด</option><option value="inactive">ปิดใช้งาน</option></select>
<button class="outline-btn" id="refreshBtn">↻ รีเฟรช</button>
</div>
<div id="table"></div><p class="message" id="message"></p>
</section>
</main></div></div>
<div class="modal hidden" id="ingredientModal"><div class="modal-card">
<div class="modal-head"><div><h3 id="ingredientModalTitle">เพิ่มวัตถุดิบ</h3><p class="mini-note">Raw = ของที่ซื้อเข้ามา • Prep = ของที่ผลิต/เตรียมภายในร้าน</p></div><button class="close-btn" id="closeIngredientModal">×</button></div>
<input id="ingredientId" type="hidden"/>
<div class="form-grid">
<label class="field"><span>ชื่อวัตถุดิบ</span><input id="ingredientName"/></label>
<label class="field"><span>หน่วย</span><input id="ingredientUnit" placeholder="g, kg, ml, ขวด, ชิ้น"/></label>
<label class="field"><span>ประเภท</span><select id="ingredientType"><option value="raw">Raw Ingredient</option><option value="prep">Prep / แปรรูป</option><option value="beverage">เครื่องดื่ม</option><option value="packaging">Packaging</option><option value="consumable">Consumable</option></select></label>
<label class="field"><span>หมวดวัตถุดิบ</span><select id="ingredientCategory"></select></label>
<label class="field"><span>รอบตรวจนับ</span><select id="ingredientFrequency"><option value="daily">ทุกวัน</option><option value="weekly">ทุกสัปดาห์</option><option value="monthly">ทุกเดือน</option></select></label>
<label class="field"><span>ต้นทุนซื้อ/หน่วย</span><input id="ingredientCost" min="0" step="0.0001" type="number"/></label>
<label class="field" id="rawYieldWrap"><span>Usable Yield % (เฉพาะ Raw)</span><input id="ingredientUsableYield" max="100" min="0.01" placeholder="เช่น 90" step="0.01" type="number" value="100"/><small class="mini-note">ตัวอย่าง ซื้อ 1,000 g ใช้ได้ 900 g = 90%</small></label>
<label class="field"><span>Stock ขั้นต่ำ</span><input id="ingredientMin" min="0" step="0.001" type="number"/></label>
<label class="field" id="yieldWrap"><span>Production Yield % (เฉพาะ Prep)</span><input id="ingredientYield" max="100" min="0.01" placeholder="เช่น 75" step="0.01" type="number"/></label>
<label class="field form-wide"><span><input checked="" id="ingredientActive" type="checkbox"/> เปิดใช้งาน</span></label>
</div>
<p class="message" id="ingredientFormMessage"></p>
<button class="primary-btn full" id="saveIngredientBtn">บันทึก</button>
</div></div>
<div class="modal hidden" id="adjustModal"><div class="modal-card">
<div class="modal-head"><div><h3>ปรับ Stock</h3><p id="adjustName"></p></div><button class="close-btn" id="closeAdjustModal">×</button></div>
<input id="adjustId" type="hidden"/>
<div class="form-grid">
<label class="field"><span>ประเภท</span><select id="movementType"><option value="receive">รับเข้า</option><option value="issue">เบิกออก</option><option value="waste">ของเสีย</option><option value="adjust_in">ปรับเพิ่ม</option><option value="adjust_out">ปรับลด</option></select></label>
<label class="field"><span>จำนวน</span><input id="adjustQty" min="0.0001" step="0.001" type="number"/></label>
<label class="field"><span>ต้นทุนต่อหน่วย</span><input id="adjustCost" min="0" step="0.0001" type="number"/></label>
<label class="field form-wide"><span>หมายเหตุ</span><textarea id="adjustNote" rows="3"></textarea></label>
</div>
<p class="message" id="adjustMessage"></p>
<button class="primary-btn full" id="saveAdjustBtn">บันทึก Movement</button>
</div></div>
<script src="../js/ingredients.js" type="module"></script>
<script type="module">
import { installReportToolbar } from '../js/report-tools.js';
installReportToolbar();
</script><script defer="True" src="../js/ui-store-v3.21.js"></script><script src="../js/ui-safe-v3.23.js"></script><script src="../js/ui-bottom-nav-v3.26.js"></script><script src="../js/ui-overlay-v3.27.js"></script></body></html>
