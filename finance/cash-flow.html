<!DOCTYPE html>

<html lang="th">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport"/>
<title>Cash Flow | CHAIXI BAMEEKIAO Back Office</title>
<link href="../css/app.css" rel="stylesheet"/>
<link href="../css/stock-v2.css" rel="stylesheet"/>
<link href="../css/responsive.css" rel="stylesheet"/>
<link href="../css/ui-store-v3.21.css" rel="stylesheet"/><link href="../css/ui-safe-v3.23.css" rel="stylesheet"/><link href="../css/ui-bottom-nav-v3.26.css" rel="stylesheet"/><link rel="stylesheet" href="../css/ui-overlay-v3.27.css"></head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
<div class="sidebar-brand"><strong>CHAIXI BAMEEKIAO</strong><small>Back Office</small></div>
<nav data-backoffice-nav></nav>
</aside>
<script src="../js/backoffice-sidebar.js"></script>
<div class="main">
<header class="topbar">
<div class="topbar-left"><button class="menu-btn" id="menuBtn">☰</button><div><h1>💵 Cash Flow</h1><p id="branchText">กำลังโหลด...</p></div></div>
<div class="user-box"><span class="user-name" id="userName">-</span><span class="role-pill" id="roleBadge">-</span><button class="outline-btn" id="logoutBtn">ออกจากระบบ</button></div>
</header>
<main class="content">
<div class="page-head">
<div><h2>Cash Flow Dashboard</h2><p>เงินเข้าจริงจากยอดขาย − ค่าใช้จ่ายจริง − เงินจ่าย Supplier + แผนจ่ายล่วงหน้า</p></div>
<button class="outline-btn" id="refreshBtn">↻ รีเฟรช</button>
</div>
<section class="panel">
<div class="toolbar cashflow-toolbar">
<label class="field"><span>ตั้งแต่</span><input id="dateFrom" type="date"/></label>
<label class="field"><span>ถึง</span><input id="dateTo" type="date"/></label>
<div class="quick-range"><button class="small-btn" data-days="0">วันนี้</button><button class="small-btn" data-days="6">7 วัน</button><button class="small-btn" data-days="29">30 วัน</button></div>
</div>
</section>
<section class="kpi-grid" id="kpis"></section>
<section class="panel">
<div class="section-head"><div><strong>กระแสเงินสดรายวัน</strong><div class="mini-note">Actual Net = Sales − Expenses − Supplier Payments</div></div></div>
<div class="cashflow-chart" id="dailyChart"></div>
</section>
<section class="panel">
<div class="section-head"><strong>รายละเอียดรายวัน</strong><span class="mini-note" id="dayCount">0 วัน</span></div>
<div id="dailyTable"></div>
</section>
<section class="panel">
<div class="section-head"><strong>รายการเงินออกจริง</strong><span class="mini-note" id="outflowCount">0 รายการ</span></div>
<div id="outflowTable"></div>
</section>
<p class="message" id="message"></p>
</main>
</div>
</div>
<script src="../js/cash-flow.js" type="module"></script>
<script defer="True" src="../js/ui-store-v3.21.js"></script><script src="../js/ui-safe-v3.23.js"></script><script src="../js/ui-bottom-nav-v3.26.js"></script><script src="../js/ui-overlay-v3.27.js"></script></body></html>
